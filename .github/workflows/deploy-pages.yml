name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo is served at https://<owner>.github.io/portfolio-main-l/, so the
# app must be built with that base path. Must match the repository name.
env:
  BASE_PATH: /portfolio-main-l/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Prepare Pages output
        run: |
          cd dist/client
          cp _shell.html index.html
          cp _shell.html 404.html
          touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
